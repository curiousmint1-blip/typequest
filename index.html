<style>
/* ============ THEMES ============ */
:root{
  --mono: ui-monospace,'Cascadia Code','JetBrains Mono','Fira Code',Consolas,'Courier New',monospace;
  --font: 'Segoe UI',system-ui,-apple-system,'Noto Sans Bengali',Roboto,'Helvetica Neue',Arial,sans-serif;
  --r: 14px;
}
html[data-theme="synthwave"]{
  --bg:#0b0614;--bg2:#150b2a;--card:rgba(255,255,255,.045);--card2:rgba(255,255,255,.08);
  --line:rgba(255,255,255,.1);--text:#efeaff;--muted:#9d93c4;
  --a1:#ff2d95;--a2:#00e5ff;--a3:#8b5cf6;--good:#2dffb0;--bad:#ff4d6d;--warn:#ffd43b;
  --glow:rgba(255,45,149,.35);color-scheme:dark;
}
html[data-theme="dracula"]{
  --bg:#21222c;--bg2:#282a36;--card:rgba(255,255,255,.05);--card2:rgba(255,255,255,.09);
  --line:rgba(255,255,255,.1);--text:#f8f8f2;--muted:#8ea0c0;
  --a1:#ff79c6;--a2:#8be9fd;--a3:#bd93f9;--good:#50fa7b;--bad:#ff5555;--warn:#f1fa8c;
  --glow:rgba(255,121,198,.35);color-scheme:dark;
}
html[data-theme="matrix"]{
  --bg:#010a02;--bg2:#02160a;--card:rgba(0,255,102,.05);--card2:rgba(0,255,102,.1);
  --line:rgba(0,255,102,.14);--text:#d9ffe4;--muted:#56a86e;
  --a1:#00ff66;--a2:#7dffb0;--a3:#00cc52;--good:#00ff66;--bad:#ff4444;--warn:#ccff00;
  --glow:rgba(0,255,102,.3);color-scheme:dark;
}
html[data-theme="nord"]{
  --bg:#242933;--bg2:#2e3440;--card:rgba(216,222,231,.05);--card2:rgba(216,222,231,.09);
  --line:rgba(216,222,231,.12);--text:#eceff4;--muted:#7b88a1;
  --a1:#88c0d0;--a2:#81a1c1;--a3:#b48ead;--good:#a3be8c;--bad:#bf616a;--warn:#ebcb8b;
  --glow:rgba(136,192,208,.3);color-scheme:dark;
}
html[data-theme="sunset"]{
  --bg:#1c0f18;--bg2:#2b1424;--card:rgba(255,255,255,.05);--card2:rgba(255,255,255,.09);
  --line:rgba(255,190,160,.14);--text:#fff3e8;--muted:#c9a5a0;
  --a1:#ff6b35;--a2:#ffc145;--a3:#ff4d8d;--good:#7dffb0;--bad:#ff4d6d;--warn:#ffd43b;
  --glow:rgba(255,107,53,.35);color-scheme:dark;
}
html[data-theme="light"]{
  --bg:#f4f5fb;--bg2:#ffffff;--card:#ffffff;--card2:#eef0f8;
  --line:#e2e5f0;--text:#1c1e2b;--muted:#6b7280;
  --a1:#6c5ce7;--a2:#00b8d9;--a3:#e84393;--good:#16a34a;--bad:#e11d48;--warn:#d97706;
  --glow:rgba(108,92,231,.25);color-scheme:light;
}
/* ============ BASE ============ */
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:var(--font);background:var(--bg);color:var(--text);
  min-height:100vh;overflow-x:hidden;line-height:1.55;
  transition:background .3s,color .3s;
}
::selection{background:var(--a1);color:#fff}
::-webkit-scrollbar{width:10px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--card2);border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:var(--a3)}
a{color:inherit;text-decoration:none}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--a2);outline-offset:2px}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.wrap{max-width:1000px;margin:0 auto;padding:0 22px}
/* background fx */
.blob{position:fixed;border-radius:50%;filter:blur(80px);opacity:.3;z-index:-2;pointer-events:none}
#b1{width:540px;height:540px;background:var(--a1);top:-160px;left:-140px;animation:blob1 26s ease-in-out infinite alternate}
#b2{width:480px;height:480px;background:var(--a2);bottom:-180px;right:-140px;opacity:.18;animation:blob2 32s ease-in-out infinite alternate}
#b3{width:400px;height:400px;background:var(--a3);top:40%;left:55%;opacity:.16;animation:blob3 38s ease-in-out infinite alternate}
html[data-theme="light"] .blob{opacity:.14}
@keyframes blob1{to{transform:translate(120px,80px) scale(1.15)}}
@keyframes blob2{to{transform:translate(-100px,-70px) scale(1.2)}}
@keyframes blob3{to{transform:translate(-140px,60px) scale(.85)}}
.gridfx{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:44px 44px;
  -webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000 20%,transparent 72%);
  mask-image:radial-gradient(ellipse at 50% 0%,#000 20%,transparent 72%);
}
html[data-theme="light"] .gridfx{opacity:.6}
#fx{position:fixed;inset:0;z-index:60;pointer-events:none}
/* ============ SITE BODY + AD RAILS ============ */
.site-body{display:flex;justify-content:center;align-items:flex-start;gap:20px}
#app{width:100%;max-width:1000px;min-width:0}
.ad-rail{flex:0 0 170px;width:170px;position:sticky;top:84px;display:none}
.ad-box{width:160px;height:600px;margin:0 auto;border:1.5px dashed color-mix(in srgb,var(--muted) 45%,transparent);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);background:var(--card);overflow:hidden}
.ad-box .ad-tag{font-size:10px;font-weight:800;letter-spacing:2.5px;opacity:.75}
.ad-box .ad-size{font-family:var(--mono);font-size:11px;opacity:.6}
@media(min-width:1480px){.ad-rail{display:block}}
/* ============ HEADER ============ */
.site-h{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 78%,transparent);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;justify-content:space-between;height:64px;gap:14px}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
/* logo: mechanical keycap mark + caret wordmark */
.logocap{display:grid;place-items:center;width:42px;height:40px;border-radius:11px;font-family:var(--mono);
  font-weight:800;font-size:20px;color:#fff;background:linear-gradient(160deg,var(--a1),var(--a3));
  border:1px solid rgba(255,255,255,.22);text-shadow:0 1px 2px rgba(0,0,0,.35);
  box-shadow:0 4px 0 color-mix(in srgb,var(--a3) 55%,#000),0 9px 20px var(--glow);
  transition:transform .09s ease,box-shadow .09s ease}
.logo:hover .logocap{transform:translateY(1.5px);box-shadow:0 2.5px 0 color-mix(in srgb,var(--a3) 55%,#000),0 6px 12px var(--glow)}
.logo:active .logocap{transform:translateY(4px);box-shadow:0 0 0 color-mix(in srgb,var(--a3) 55%,#000),0 3px 8px var(--glow)}
.logotype{font-weight:800;font-size:19px;letter-spacing:-.3px;white-space:nowrap;animation:tq-glitch 7s infinite}
.logotype b{background:linear-gradient(135deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
@keyframes tq-glitch{
 0%,91%,94.5%,100%{transform:none;filter:none}
 91.5%{transform:translate(-1.6px,1px) skewX(-6deg);filter:drop-shadow(2px 0 0 rgba(255,60,90,.75)) drop-shadow(-2px 0 0 rgba(0,229,255,.75))}
 92.5%{transform:translate(1.6px,-1px) skewX(4deg);filter:drop-shadow(-2px 0 0 rgba(255,60,90,.75)) drop-shadow(2px 0 0 rgba(0,229,255,.75))}
 93.5%{transform:translate(-.8px,.4px);filter:drop-shadow(1px 0 0 rgba(255,60,90,.5))}
}
@media (prefers-reduced-motion:reduce){.logotype{animation:none}}
.lcaret{display:inline-block;width:3px;height:.72em;margin:0 4px 0 2px;border-radius:2px;vertical-align:-.04em;
  background:linear-gradient(180deg,var(--a1),var(--a2));box-shadow:0 0 7px color-mix(in srgb,var(--a2) 70%,transparent);
  animation:blink 1.1s steps(2,start) infinite}
.mainnav{display:flex;gap:4px}
.navlink{padding:8px 13px;border-radius:10px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer;transition:.18s;position:relative;white-space:nowrap}
.navlink:hover{color:var(--text);background:var(--card)}
.navlink.active{color:var(--text);background:var(--card2)}
.navlink.active::after{content:"";position:absolute;left:13px;right:13px;bottom:3px;height:2px;border-radius:2px;
  background:linear-gradient(90deg,var(--a1),var(--a2))}
.hctl{display:flex;align-items:center;gap:8px}
.hbtn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:16px;
  background:var(--card);border:1px solid var(--line);transition:.18s;user-select:none}
.hbtn:hover{border-color:var(--a2);transform:translateY(-1px)}
.themewrap{position:relative}
.pop{position:absolute;top:46px;right:0;background:var(--bg2);border:1px solid var(--line);border-radius:14px;
  padding:10px;display:none;grid-template-columns:1fr 1fr;gap:8px;box-shadow:0 16px 50px rgba(0,0,0,.4);z-index:55;width:250px}
.pop.show{display:grid;animation:popIn .18s ease}
.burger{display:none}
/* ============ BUTTONS / CHIPS ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 24px;border-radius:12px;
  font-weight:700;font-size:15px;transition:.18s;user-select:none;border:1px solid transparent}
.btn.primary{background:linear-gradient(135deg,var(--a1),var(--a3));color:#fff;box-shadow:0 6px 22px var(--glow)}
.btn.primary:hover{transform:translateY(-2px);box-shadow:0 10px 30px var(--glow);filter:brightness(1.08)}
.btn.primary:active{transform:translateY(0) scale(.98)}
.btn.ghost{background:var(--card);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--a2);transform:translateY(-2px)}
.btn.sm{padding:8px 16px;font-size:13px;border-radius:10px}
.btn.danger{background:color-mix(in srgb,var(--bad) 15%,transparent);border-color:var(--bad);color:var(--bad)}
.btn.danger:hover{background:var(--bad);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);
  font-weight:600;font-size:13px;color:var(--muted);cursor:pointer;transition:.16s;user-select:none}
.chip:hover{color:var(--text);border-color:var(--a2)}
.chip.active{background:linear-gradient(135deg,var(--a1),var(--a3));color:#fff;border-color:transparent;box-shadow:0 0 14px var(--glow)}
.chip-label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-right:2px}
/* ============ CARDS / SECTIONS ============ */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:.22s}
.card.hov:hover{transform:translateY(-4px);border-color:color-mix(in srgb,var(--a2) 45%,var(--line));box-shadow:0 14px 34px rgba(0,0,0,.25)}
.section{margin:44px 0}
.sec-head{margin-bottom:20px}
.sec-title{font-size:26px;font-weight:800;letter-spacing:-.4px}
.sec-title b{background:linear-gradient(135deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sec-sub{color:var(--muted);font-size:14.5px;margin-top:4px}
.view{animation:slideUp .4s ease both}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(var(--rot,0deg))}50%{transform:translateY(-16px) rotate(var(--rot,0deg))}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.shake{animation:shake .3s ease}
/* ============ HERO ============ */
.hero{position:relative;padding:64px 0 30px;text-align:center;overflow:visible}
.hero-badge{display:inline-flex;align-items:center;gap:8px;padding:7px 16px;border-radius:999px;
  background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted);margin-bottom:22px}
.hero-badge .dotpulse{width:8px;height:8px;border-radius:50%;background:var(--good);animation:dotPulse 1.6s infinite}
@keyframes dotPulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 60%,transparent)}50%{box-shadow:0 0 0 6px transparent}}
.hero-title{font-size:clamp(46px,9vw,86px);font-weight:900;letter-spacing:-3px;line-height:1.04;
  background:linear-gradient(110deg,var(--a1),var(--a3),var(--a2),var(--a1));background-size:280% 100%;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  animation:gradMove 7s linear infinite}
@keyframes gradMove{to{background-position:280% 0}}
.type-demo{font-family:var(--mono);font-size:clamp(15px,2.6vw,21px);color:var(--muted);margin:18px 0 8px;min-height:32px}
.type-demo .dcaret{display:inline-block;width:10px;height:1.15em;vertical-align:text-bottom;margin-left:2px;border-radius:2px;
  background:var(--a2);box-shadow:0 0 10px var(--a2);animation:blink 1s steps(2,start) infinite}
@keyframes blink{50%{opacity:0}}
.hero-desc{max-width:560px;margin:10px auto 0;color:var(--muted);font-size:16px}
.cta-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:30px}
.floatkeys{position:absolute;inset:0;pointer-events:none;z-index:-1}
.fk{position:absolute;font-family:var(--mono);font-weight:700;font-size:15px;color:var(--muted);
  border:1px solid var(--line);border-radius:9px;padding:5px 10px;background:var(--card);opacity:.5;
  animation:floaty var(--dur,7s) ease-in-out infinite;animation-delay:var(--del,0s);box-shadow:0 8px 20px rgba(0,0,0,.2)}
/* ============ FEATURE GRID / STATS CARDS ============ */
.feature-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.feature .ic{width:48px;height:48px;border-radius:13px;display:grid;place-items:center;font-size:23px;margin-bottom:14px;
  background:linear-gradient(135deg,color-mix(in srgb,var(--a1) 25%,transparent),color-mix(in srgb,var(--a2) 25%,transparent));
  border:1px solid var(--line)}
.feature h3{font-size:16.5px;font-weight:800;margin-bottom:6px}
.feature p{color:var(--muted);font-size:13.5px}
.how-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.how-step{display:flex;gap:14px;align-items:flex-start}
.how-num{flex:0 0 40px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:16px;
  color:#fff;background:linear-gradient(135deg,var(--a1),var(--a3));box-shadow:0 4px 14px var(--glow)}
.how-step h3{font-size:15.5px;font-weight:800}
.how-step p{color:var(--muted);font-size:13.5px;margin-top:3px}
.stat-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat-cards.six{grid-template-columns:repeat(6,1fr)}
.grow{flex:1}
.scard{text-align:center;padding:18px 12px}
.scard .sv{font-size:30px;font-weight:900;font-family:var(--mono);
  background:linear-gradient(135deg,var(--a2),var(--a1));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.scard .sl{color:var(--muted);font-size:12.5px;font-weight:600;margin-top:2px}

/* ============ PRACTICE / TYPING ============ */
.modebar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;margin-bottom:18px}
.modebar .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.statsbar{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:640px;margin:0 auto 18px}
.sbox{text-align:center;padding:12px 8px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.sbox .sv{font-family:var(--mono);font-weight:800;font-size:30px;line-height:1.1;transition:.15s}
.sbox.big .sv{font-size:38px;background:linear-gradient(135deg,var(--a2),var(--a1));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sbox .sl{font-size:11px;font-weight:700;letter-spacing:1.5px;color:var(--muted)}
.sbox .sv.pulse{animation:statPulse .3s ease}
@keyframes statPulse{50%{transform:scale(1.12)}}
.typing-card{position:relative;background:var(--card);border:2px solid var(--line);border-radius:18px;
  padding:26px 22px;cursor:text;transition:border-color .25s;user-select:none;overflow:hidden}
.typing-card.focused{border-color:color-mix(in srgb,var(--a2) 55%,var(--line));box-shadow:0 0 0 4px color-mix(in srgb,var(--a2) 10%,transparent)}
.words-viewport{position:relative;height:135px;overflow:hidden}
.words{position:relative;font-family:var(--mono);font-size:27px;line-height:45px;font-weight:500;
  color:var(--muted);display:flex;flex-wrap:wrap;align-content:flex-start;row-gap:0;transition:transform .25s ease}
.word{margin:0 .3em;padding:0 2px;white-space:nowrap;border-radius:5px}
.word.cur{background:color-mix(in srgb,var(--a2) 9%,transparent)}
.word.done .ch.ok{color:color-mix(in srgb,var(--text) 70%,var(--bg))}
.ch.ok{color:var(--text)}
.ch.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,transparent);border-radius:3px}
.ch.extra{color:var(--bad);opacity:.75}
.wshake{animation:shake .25s ease}
.caret{position:absolute;top:4px;left:0;width:2.5px;border-radius:3px;background:var(--a2);
  box-shadow:0 0 9px var(--a2),0 0 18px color-mix(in srgb,var(--a2) 50%,transparent);
  transition:transform 80ms cubic-bezier(.2,.7,.3,1);z-index:2;animation:blink 1.1s steps(2,start) infinite}
.caret.typing{animation:none}
.caret.block{width:11px;opacity:.35}
.caret.underline{height:3.5px !important;opacity:.95}
.focus-hint{position:absolute;inset:0;display:grid;place-items:center;gap:6px;z-index:3;
  background:color-mix(in srgb,var(--bg) 55%,transparent);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
  font-weight:700;color:var(--muted);font-size:15px;transition:opacity .2s;pointer-events:none}
.focus-hint .fk-ic{font-size:28px;animation:floaty 2.4s ease-in-out infinite}
.typing-card.focused .focus-hint,.typing-card.done .focus-hint,.typing-card.started .focus-hint{opacity:0}
.combo-pop{position:absolute;top:8px;right:14px;font-weight:900;font-size:19px;pointer-events:none;opacity:0;
  background:linear-gradient(135deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.combo-pop.on{animation:comboPop .9s ease forwards}
@keyframes comboPop{0%{opacity:0;transform:scale(.5) rotate(-4deg)}20%{opacity:1;transform:scale(1.15)}35%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
.missflash{position:absolute;inset:0;border-radius:16px;pointer-events:none;opacity:0;
  box-shadow:inset 0 0 70px var(--bad)}
.missflash.on{animation:missF .28s ease}
@keyframes missF{30%{opacity:1}}
.spark-wrap{max-width:640px;margin:14px auto 0}
.spark{width:100%;height:44px;display:block}
.progress{height:9px;border-radius:999px;background:var(--card2);border:1px solid var(--line);overflow:hidden}
.progress .fill{height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg,var(--a1),var(--a2));
  box-shadow:0 0 10px var(--glow);transition:width .2s ease}
.progrow{display:flex;align-items:center;gap:12px;max-width:640px;margin:0 auto 14px}
.progrow .pl{font-size:12.5px;font-weight:700;color:var(--muted);white-space:nowrap}
.progrow .progress{flex:1}
.hint-chip{display:flex;gap:10px;align-items:center;justify-content:center;margin:16px 0 10px;
  font-weight:600;color:var(--muted);font-size:14px;flex-wrap:wrap;min-height:26px}
.hint-chip .fdot{width:11px;height:11px;border-radius:50%;background:var(--fc,var(--a2));box-shadow:0 0 8px var(--fc,var(--a2))}
.keycap{display:inline-grid;place-items:center;min-width:30px;height:30px;padding:0 8px;border-radius:8px;
  font-family:var(--mono);font-weight:700;font-size:14px;background:var(--card2);border:1px solid var(--line);
  border-bottom-width:3px;color:var(--text)}
.toolrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
/* ============ KEYBOARD ============ */
.kb-wrap{max-width:900px;margin:6px auto 0;transition:opacity .25s}
.keyboard{display:flex;flex-direction:column;gap:6px;user-select:none}
.kbrow{display:flex;gap:6px}
.key{--fc:var(--a2);--gw:1;flex:var(--gw) 1 0;min-width:0;height:48px;border-radius:9px;position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-bottom-width:3px;
  font-family:var(--mono);font-weight:600;font-size:14px;transition:.1s;cursor:default}
.key .sh{font-size:9.5px;opacity:.45;line-height:1;height:11px}
.key .main{line-height:1.15}
.key .fdot{position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:var(--fc);opacity:.85}
.key.next{border-color:var(--fc);box-shadow:0 0 0 1px var(--fc),0 0 16px color-mix(in srgb,var(--fc) 60%,transparent);
  animation:nextPulse 1s ease-in-out infinite}
.key.next .main{color:var(--fc);font-weight:800}
@keyframes nextPulse{50%{box-shadow:0 0 0 1px var(--fc),0 0 26px var(--fc)}}
.key.press{transform:translateY(2px);background:var(--card2);border-bottom-width:1px}

/* ============ RESULTS ============ */
.results{display:none;animation:popIn .3s ease}
.results.show{display:block}
.res-hero{display:flex;gap:16px;justify-content:center;align-items:stretch;flex-wrap:wrap;margin:6px 0 20px;position:relative}
.res-big{text-align:center;padding:10px 26px}
.res-big .rv{font-family:var(--mono);font-weight:900;font-size:56px;line-height:1.05}
.res-big.wpm .rv{background:linear-gradient(135deg,var(--a2),var(--a1));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.res-big .rl{color:var(--muted);font-size:12px;font-weight:700;letter-spacing:1.5px}
.pb-badge{display:inline-block;padding:6px 18px;border-radius:999px;font-weight:900;font-size:13px;letter-spacing:1px;

.res-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.rbox{text-align:center;padding:12px 8px;background:var(--card);border:1px solid var(--line);border-radius:13px}
.rbox .rv{font-family:var(--mono);font-weight:800;font-size:22px}
.rbox .rv.good{color:var(--good)} .rbox .rv.badc{color:var(--bad)}
.rbox .rl{color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.5px}
.res-chart{margin-bottom:16px}
.res-chart .cl{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}
.res-keys{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;margin-bottom:6px}
.res-keys .keycap.bad{border-color:var(--bad);color:var(--bad)}
.bigstars{display:flex;justify-content:center;gap:14px;margin:8px 0 14px}
.bigstars .bstar{font-size:52px;color:var(--line);filter:grayscale(1);transition:.2s}
.bigstars .bstar.on{color:var(--warn);filter:none;text-shadow:0 0 24px color-mix(in srgb,var(--warn) 60%,transparent);animation:starPop .5s ease backwards}
.bigstars .bstar:nth-child(2).on{animation-delay:.2s}
.bigstars .bstar:nth-child(3).on{animation-delay:.4s}
@keyframes starPop{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
.res-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.res-msg{text-align:center;font-weight:800;font-size:17px;margin-bottom:4px}
.res-msg.ok{color:var(--good)} .res-msg.no{color:var(--bad)}
/* ============ LESSONS ============ */
.lesson-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.lcard{cursor:pointer;position:relative}
.lcard:hover{transform:translateY(-4px);border-color:color-mix(in srgb,var(--a2) 45%,var(--line))}
.lcard .ltop{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.lcard .lnum{font-family:var(--mono);font-weight:900;font-size:15px;color:var(--muted)}
.lstars{font-size:15px;letter-spacing:2px;color:var(--card2)}
.lstars .on{color:var(--warn);text-shadow:0 0 10px color-mix(in srgb,var(--warn) 55%,transparent)}
.lcard h3{font-size:16px;font-weight:800;margin-bottom:6px}
.lkeys{display:flex;gap:5px;flex-wrap:wrap}
.lkeys span{font-family:var(--mono);font-size:12px;font-weight:700;padding:2px 7px;border-radius:6px;
  background:var(--card2);border:1px solid var(--line)}
.lcard.locked{opacity:.5;filter:grayscale(.7)}
.lcard.locked:hover{transform:none;border-color:var(--line)}
.lcard .lockic{position:absolute;top:16px;right:18px;font-size:15px}
.keycaps{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.keycap.big{min-width:52px;height:52px;font-size:22px;border-bottom-width:5px}
.keycap.f{border-color:var(--fc);color:var(--fc);box-shadow:0 0 14px color-mix(in srgb,var(--fc) 35%,transparent)}
.hands-wrap{display:flex;justify-content:center;gap:20px;flex-wrap:wrap;margin:14px 0}
.hands-wrap svg{max-width:100%;height:auto}
.inst-list{display:flex;flex-direction:column;gap:10px;text-align:left;max-width:660px;margin:0 auto}
.inst{display:flex;gap:11px;align-items:flex-start;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:12px 14px}
.inst .iic{flex:0 0 auto;font-size:17px}
.inst .ibn{font-weight:700;font-size:14.5px}
.inst .ien{color:var(--muted);font-size:12.5px;margin-top:2px}
.lesson-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.lesson-head h2{font-size:24px;font-weight:900}
.lesson-head .grow{flex:1}
/* ============ GUIDE ============ */
.legend{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0}
.lg{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--muted);
  background:var(--card);border:1px solid var(--line);padding:5px 11px;border-radius:999px}
.lg .fdot{width:9px;height:9px;border-radius:50%;background:var(--fc)}
.ginfo{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap;margin:16px 0;min-height:64px}
.ginfo .gi-key{font-family:var(--mono);font-weight:900;font-size:26px;min-width:64px;height:64px;display:grid;place-items:center;
  border-radius:14px;background:var(--card2);border:2px solid var(--fc,var(--line));color:var(--fc,var(--text));
  box-shadow:0 0 20px color-mix(in srgb,var(--fc) 30%,transparent)}
.ginfo .gi-t{font-size:17px;font-weight:800}
.ginfo .gi-s{color:var(--muted);font-size:13px}
.tips-list{display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:left}
.tip{display:flex;gap:11px;align-items:flex-start}
.tip .tic{flex:0 0 34px;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:16px;
  background:var(--card2);border:1px solid var(--line)}
.tip .tb{font-weight:700;font-size:14px}
.tip .ts{color:var(--muted);font-size:12.5px;margin-top:2px}
/* ============ GAMES ============ */
.game-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.gcard{padding:0;overflow:hidden;cursor:pointer}
.gcard:hover{transform:translateY(-5px);border-color:color-mix(in srgb,var(--a2) 50%,var(--line));box-shadow:0 18px 40px rgba(0,0,0,.3)}
.gpreview{height:150px;position:relative;overflow:hidden;background:
  radial-gradient(circle at 30% 20%,color-mix(in srgb,var(--a1) 25%,transparent),transparent 60%),
  radial-gradient(circle at 75% 80%,color-mix(in srgb,var(--a2) 20%,transparent),transparent 55%),var(--bg2)}
.pv-w{position:absolute;font-family:var(--mono);font-weight:700;font-size:15px;color:var(--text);
  animation:fall linear infinite}
@keyframes fall{from{transform:translateY(-30px);opacity:0}12%{opacity:1}88%{opacity:1}to{transform:translateY(150px);opacity:0}}
.pv-ship{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-size:30px;animation:shipBob 2.2s ease-in-out infinite}
@keyframes shipBob{50%{transform:translateX(-50%) translateY(-7px)}}
.pv-al{position:absolute;font-size:22px;animation:alBob 2.8s ease-in-out infinite}
@keyframes alBob{50%{transform:translateY(8px)}}
.gbody{padding:18px 20px}
.gbody h3{font-size:19px;font-weight:900}
.gbody p{color:var(--muted);font-size:13.5px;margin:6px 0 14px}
.gmeta{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.gbest{font-size:13px;font-weight:700;color:var(--muted)}
.gbest b{font-family:var(--mono);color:var(--a2);font-size:16px}
.game-shell{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#050310}

  font-weight:800;font-size:14px;font-family:var(--mono);display:flex;align-items:center;gap:7px}
.hbox .hl{font-size:9.5px;letter-spacing:1px;opacity:.55;font-family:var(--font)}
.hbox.hright{margin-left:auto}
.hearts{font-size:13px;letter-spacing:2px}
.overlay{position:absolute;inset:0;display:none;place-items:center;z-index:6;
  background:rgba(3,2,10,.72);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px)}
.overlay.show{display:grid}
.ov-card{text-align:center;padding:30px 40px;border-radius:20px;background:var(--bg2);border:1px solid var(--line);
  box-shadow:0 24px 70px rgba(0,0,0,.5);animation:popIn .25s ease;max-width:420px;margin:20px}
.ov-card h2{font-size:27px;font-weight:900;margin-bottom:8px}
.ov-card p{color:var(--muted);font-size:14px;margin-bottom:6px}
.ov-score{font-family:var(--mono);font-size:52px;font-weight:900;line-height:1.1;
  background:linear-gradient(135deg,var(--a2),var(--a1));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.ov-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}

.banner span{font-size:44px;font-weight:900;letter-spacing:1px;
  background:linear-gradient(135deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;

@keyframes bannerPop{0%{opacity:0;transform:scale(.4)}18%{opacity:1;transform:scale(1.12)}30%{transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:scale(1.05) translateY(-18px)}}
.newbest-tag{display:inline-block;margin:8px 0;padding:5px 15px;border-radius:999px;font-weight:900;font-size:12.5px;

.heatmap{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;margin-top:8px}
.hcell{aspect-ratio:1;border-radius:9px;display:grid;place-items:center;font-family:var(--mono);font-weight:800;
  font-size:13.5px;border:1px solid rgba(128,128,128,.2);cursor:default;color:#0b0614;transition:.15s}

.ach-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}

.set-group{margin-bottom:18px}
.set-group h3{font-size:15px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.theme-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tsw{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:13px;background:var(--card);

.tsw[data-theme=dracula] .sw{background:linear-gradient(90deg,#ff79c6 33%,#50fa7b 33% 66%,#282a36 66%)}
.tsw[data-theme=matrix] .sw{background:linear-gradient(90deg,#00ff66 33%,#00cc52 33% 66%,#010a02 66%)}
.tsw[data-theme=nord] .sw{background:linear-gradient(90deg,#88c0d0 33%,#b48ead 33% 66%,#2e3440 66%)}
.tsw[data-theme=sunset] .sw{background:linear-gradient(90deg,#ff6b35 33%,#ffc145 33% 66%,#2b1424 66%)}
.tsw[data-theme=light] .sw{background:linear-gradient(90deg,#6c5ce7 33%,#00b8d9 33% 66%,#f4f5fb 66%)}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;

.set-row:last-child{border-bottom:none}
.set-row .sr-t{font-weight:700;font-size:14.5px}
.set-row .sr-s{color:var(--muted);font-size:12.5px}
.switch{width:48px;height:27px;border-radius:999px;background:var(--card2);border:1px solid var(--line);
  position:relative;cursor:pointer;transition:.2s;flex:0 0 auto}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;
  background:var(--muted);transition:.2s}
.switch.on{background:linear-gradient(135deg,var(--a1),var(--a3));border-color:transparent}
.switch.on::after{left:24px;background:#fff}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:11px;overflow:hidden;flex-wrap:wrap}
.seg button{padding:8px 15px;font-weight:700;font-size:13px;color:var(--muted);transition:.15s}
.seg button.active{background:linear-gradient(135deg,var(--a1),var(--a3));color:#fff}
input[type=range]{accent-color:var(--a1);width:180px}
.nosave-note{background:color-mix(in srgb,var(--warn) 12%,transparent);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);
  color:var(--warn);padding:10px 14px;border-radius:12px;font-size:13px;font-weight:600;margin-bottom:14px}
/* ============ TOASTS ============ */
#toasts{position:fixed;top:76px;right:18px;z-index:70;display:flex;flex-direction:column;gap:10px;max-width:330px}
.toast{display:flex;gap:11px;align-items:flex-start;background:var(--bg2);border:1px solid var(--line);
  border-left:3px solid var(--a1);border-radius:13px;padding:13px 15px;box-shadow:0 14px 40px rgba(0,0,0,.4);
  cursor:pointer;animation:toastIn .32s cubic-bezier(.2,.9,.3,1.2)}
@keyframes toastIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
.toast.out{animation:toastOut .3s ease forwards}
@keyframes toastOut{to{opacity:0;transform:translateX(40px)}}
.toast .tic{font-size:21px;line-height:1.2}
.toast .tt{font-weight:800;font-size:14px}
.toast .td{color:var(--muted);font-size:12.5px;margin-top:2px}
/* ============ FOOTER ============ */
.site-f{border-top:1px solid var(--line);margin-top:60px;padding:26px 0}
.frow{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:13px}
/* ============ RESPONSIVE ============ */
@media(max-width:960px){
  .feature-grid,.how-grid,.lesson-grid{grid-template-columns:1fr 1fr}
  .stat-cards{grid-template-columns:repeat(2,1fr)}
  .stat-cards.six{grid-template-columns:repeat(3,1fr)}
  .ach-grid{grid-template-columns:repeat(3,1fr)}
  .res-grid{grid-template-columns:repeat(2,1fr)}
  .mainnav{position:fixed;top:64px;left:0;right:0;flex-direction:column;background:var(--bg2);
    border-bottom:1px solid var(--line);padding:12px 18px;display:none;z-index:49;gap:2px}
  body.nav-open .mainnav{display:flex;animation:slideUp .25s ease}
  .burger{display:grid}
  .logotype{font-size:15.5px}
  .logo{gap:8px}
  .words{font-size:22px;line-height:38px}
  .words-viewport{height:114px}
  .tips-list{grid-template-columns:1fr}
  .heatmap{grid-template-columns:repeat(7,1fr)}
  .game-grid{grid-template-columns:1fr}
  .gcanvas{height:380px}
}
@media(max-width:560px){
  .feature-grid,.how-grid,.lesson-grid,.theme-grid{grid-template-columns:1fr}
  .statsbar{grid-template-columns:repeat(2,1fr)}
  .stat-cards.six{grid-template-columns:repeat(2,1fr)}
  .res-grid{grid-template-columns:repeat(2,1fr)}
  .ach-grid{grid-template-columns:repeat(2,1fr)}
  .res-big .rv{font-size:42px}
  .words{font-size:19px;line-height:33px}
  .words-viewport{height:99px}
  .key{height:40px;font-size:12px}
  .key .sh{height:9px;font-size:8px}
  .gcanvas{height:340px}
  .hero{padding-top:40px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s !important;transition-duration:.001s !important}
}

{t:"The Lion and the Mouse",s:"A lion was sleeping when a little mouse ran over his paw. The lion caught the mouse in anger. 'Please let me go,' the mouse said. 'One day I may help you.' The lion laughed but set her free. Later, the lion got trapped in a net. The mouse chewed the ropes and saved him."},

{t:"The Milkmaid and Her Pail",s:"A milkmaid balanced a pail of milk on her head and walked to the market. She dreamed about the eggs she would buy, then the chicks that would grow, then the fine dress she would wear. She tossed her head with joy, and the pail fell. The milk spilled, and all her dreams disappeared."},
{t:"The Golden Touch",s:"King Midas loved gold more than anything. A god granted his wish that everything he touched would turn to gold. At first, he was delighted. But when his food turned to gold, he could not eat. When he hugged his daughter, she turned to gold too. He wept and begged to take back the wish."},
{t:"The Fox and the Grapes",s:"A hungry fox saw ripe grapes hanging on a high vine. He jumped again and again, but he could not reach them. At last, he gave up and walked away, saying, 'The grapes are sour anyway.' People often pretend to dislike what they cannot have."},
{t:"The Honest Woodcutter",s:"A woodcutter dropped his axe in a river. A spirit appeared with a golden axe and asked, 'Is this yours?' 'No,' said the woodcutter. Then came a silver axe. 'No,' he said again. Finally, the spirit showed his old iron axe. 'That is mine!' The spirit rewarded his honesty with all three."},
{t:"The Sun and the Wind",s:"The sun and the wind argued about who was stronger. They saw a man walking in a coat. The wind blew with all its power, but the man only held his coat tighter. Then the sun shone warmly. The man soon took off his coat. Kindness works better than force."},
{t:"The Ugly Duckling",s:"A duckling looked different from his brothers and sisters. Everyone laughed at him, so he ran away. He spent a cold, lonely winter alone. In spring, he saw his reflection in a lake. He had grown into a beautiful white swan. He was never an ugly duckling at all."},
{t:"The Bundle of Sticks",s:"An old farmer's sons always fought with each other. One day, he gave them a bundle of sticks tied with a rope. He asked each son to break it. None of them could. Then he untied the bundle and gave one stick to each. They broke them easily. Together, we are strong."},
{t:"The Dog and the Bone",s:"A dog found a big bone and held it in his mouth. While crossing a bridge, he looked down and saw another dog with a bone in the water. It was only his reflection, but he barked to grab that bone too. His own bone fell into the river. Greedy dogs lose everything."},
{t:"The Cap Seller and the Monkeys",s:"A cap seller slept under a tree with a basket of caps on his head. Monkeys climbed down, took the caps, and wore them. When he woke up, he shouted at the monkeys. They only copied him. Then he threw his own cap on the ground. The monkeys did the same. He collected his caps and left."},
{t:"The Little Red Hen",s:"A little red hen found some wheat grains. She asked the cat, the dog, and the pig to help her plant them. 'Not I,' they all said. So she planted, watered, and cut the wheat alone. She baked fine bread. When they asked for a share, she said, 'Those who do not work do not eat.'"},
{t:"The Wolf and the Crane",s:"A wolf got a bone stuck in his throat. He begged a crane to pull it out with her long beak. 'What is my reward?' asked the crane. The wolf replied, 'I did not bite your head off. Is that not enough?' Expect nothing from the wicked."},
{t:"The Miser and His Gold",s:"A miser buried his gold under a tree in his garden. Every week, he dug it up and counted the coins. A worker noticed him and stole the gold. The miser cried loudly. A neighbor said, 'Bury a stone in its place. You never used the gold anyway.'"},
{t:"The Magic Paintbrush",s:"A poor boy named Mali found a magic paintbrush. Whatever he painted became real. He painted food for the hungry and shoes for barefoot children. A rich man demanded the brush for himself. Mali painted a sea, a ship, and a great wind. The greedy man sailed away and was never seen again."},
{t:"The Two Pots",s:"A clay pot and a brass pot fell into a river and floated downstream. 'Stay close to me,' said the brass pot. 'I am stronger.' The clay pot replied, 'Thank you, but your strength may break me. Let each float his own way.' The clay pot reached the bank safely by itself."},
{t:"A Rainy Day",s:"It rained all morning. Riya wanted to go to the park, but the sky was dark. She watched the raindrops race down the window glass. Her mother made hot tea and snacks. After lunch, the rain stopped, and a rainbow appeared. Riya put on her boots and jumped in every puddle she could find."},
{t:"The Lost Puppy",s:"On the way home from school, Sam heard a soft cry behind a bush. A small puppy sat there, wet and shaking. Sam carried it home and asked his mother to keep it. They gave it warm milk and a soft blanket. They named him Lucky. Now Lucky waits at the gate every day for Sam."},
{t:"My First Bicycle",s:"On her birthday, Meera got a shiny blue bicycle. At first, she fell off many times. Her knees had little cuts, but she did not give up. Her father held the seat and ran beside her. One day, he let go quietly. Meera was riding all by herself. She shouted with joy all the way down the street."},
{t:"The School Garden",s:"Our class planted a small garden behind the school. Everyone chose a different seed. I planted tomatoes. Every morning, we watered the plants and pulled out the weeds. Weeks later, tiny green leaves appeared. When the first red tomato ripened, our teacher cut it into small pieces so everyone could taste it."},
{t:"The Night Market",s:"The night market was full of lights and noise. Vendors called out, selling fruit, toys, and hot soup. Father bought us sweet pancakes. My little sister wanted a toy rabbit, and mother smiled and bought it. We walked home slowly under the stars, carrying bags and happy hearts."},
{t:"Grandmother's Stories",s:"Every summer, I visit my grandmother in her village. In the evening, we sit on the porch. She tells stories about her childhood, rivers, and faraway lands. Her voice is soft and slow. Sometimes I fall asleep before the story ends. In the morning, she smiles and starts a new one."},
{t:"The Kite Festival",s:"The sky was full of kites of every color. Arjun held the string tightly while his sister ran ahead. Their kite climbed higher and higher. A strong wind pulled it close to a tree, but Arjun pulled the string at the right moment. Their kite danced above all the others until evening."},
{t:"Helping Hands",s:"An old woman was trying to carry a heavy bag of rice up the stairs. Two students saw her and offered to help. They carried the bag to her door. She thanked them and offered them sweets. They politely refused and said, 'Helping you is sweeter than any treat.' She smiled and blessed them."},
{t:"The Little Library",s:"Rahul kept a small box of books under the banyan tree. Anyone could borrow a book and return it later. Soon, children came every evening. Some brought their own old books to add to the box. The box became a little library, and the banyan tree became the busiest corner of the village."},
{t:"A Visit to the Zoo",s:"We saw elephants spraying water and monkeys swinging on ropes. The parrots shouted hello to everyone. My brother loved the tall giraffes, but I liked the sleepy lions best. At noon, we ate sandwiches under a tree. A peacock suddenly spread its feathers, and everyone clapped. It was the best day of the holidays."},
{t:"The Paper Boat",s:"After the rain, Nita made a paper boat and floated it in a stream. The boat sailed past stones and leaves. Her little brother followed it along the bank. The boat reached a small waterfall and spun around. Nita laughed and made another one. They played until the sky turned orange."},
{t:"The Honest Taxi Driver",s:"A tourist left her phone on the taxi seat. The driver found it after his last ride. Instead of selling it, he drove back to the hotel. The tourist was overjoyed. She offered him money, but he refused with a smile. 'I only did my duty,' he said. She told everyone about the honest driver."},
{t:"The Sleepy Cat",s:"Miso the cat slept in the kitchen all day. The cook, the cleaner, and the milkman all warned her to catch mice. But Miso only yawned. One night, a mouse ran over the cook's feet. Everyone shouted for Miso. She woke up, caught the mouse in one jump, and went back to sleep."},
{t:"The First Snow",s:"Ben had never seen snow. One winter morning, he woke up and saw the whole town white. He wore his warmest coat and ran outside. Snowflakes landed on his nose. He made a snowman with a carrot nose and his father's old hat. Ben decided that winter was his favorite season."}
];

function genDrill(keys,newKeys,n){
 const out=[];
 for(let i=0;i<n;i++){
  const len=ri(2,4);let w='';
  for(let j=0;j<len;j++)w+=Math.random()<0.65?pick(newKeys):pick(keys.split(''));
  if(!newKeys.some(k=>w.includes(k)))w=w.slice(0,-1)+pick(newKeys);
  out.push(w);
 }
 return out;
}

function lessonWords(L){
 if(L.gen)return genDrill(L.keys,L.nk,36);
 if(L.punc)return shuffle(L.words).slice(0,36);

 while(arr.length<36)arr=arr.concat(shuffle(L.words));
 return shuffle(arr).slice(0,36);
}

const Sound={
 ctx:null,g:null,noiseBuf:null,
 ensure(){
  if(this.ctx){if(this.ctx.state==='suspended')this.ctx.resume();return}
  try{
   const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
   this.ctx=new AC();this.g=this.ctx.createGain();this.g.connect(this.ctx.destination);this.apply();
   const len=Math.floor(this.ctx.sampleRate*0.5),buf=this.ctx.createBuffer(1,len,this.ctx.sampleRate),d=buf.getChannelData(0);
   for(let i=0;i<len;i++)d[i]=Math.random()*2-1;this.noiseBuf=buf;
  }catch(e){}
 },
 apply(){if(this.g)this.g.gain.value=Store.data.settings.sound.on?Store.data.settings.sound.vol:0},
 tone(f,d,type,v,when,slide){if(!this.ctx)return;const tt=this.ctx.currentTime+(when||0);
  const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=type||'sine';
  o.frequency.setValueAtTime(f,tt);if(slide)o.frequency.exponentialRampToValueAtTime(slide,tt+d);
  g.gain.setValueAtTime(v||.2,tt);g.gain.exponentialRampToValueAtTime(.0001,tt+d);
  o.connect(g);g.connect(this.g);o.start(tt);o.stop(tt+d+.02)},
 hit(d,f,v,q,when){if(!this.ctx||!this.noiseBuf)return;const tt=this.ctx.currentTime+(when||0);
  const s=this.ctx.createBufferSource();s.buffer=this.noiseBuf;
  const bp=this.ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=f;bp.Q.value=q||1;
  const g=this.ctx.createGain();g.gain.setValueAtTime(v||.25,tt);g.gain.exponentialRampToValueAtTime(.0001,tt+d);
  s.connect(bp);bp.connect(g);g.connect(this.g);s.start(tt);s.stop(tt+d+.03)},
 key(space){const st=Store.data.settings.sound;if(!st.on||!this.ctx)return;const r=.9+Math.random()*.2;
  if(st.style==='soft'){this.tone(space?140:420*r,.05,'sine',.11)}
  else if(st.style==='type'){this.hit(.02,3300*r,.2,2);this.tone(space?110:900*r,.012,'square',.05)}
  else{this.hit(.028,2100*r,.28,1.2);this.tone(space?95:175*r,.045,'triangle',.13)}},
 err(){if(!this.ctx)return;this.tone(150,.08,'square',.1);this.tone(110,.12,'square',.1,.07)},
 ok(){this.tone(880,.05,'sine',.08)},
 combo(){[660,880,1175].forEach((f,i)=>this.tone(f,.06,'sine',.1,i*.05))},
 success(){[523,659,784,1047].forEach((f,i)=>this.tone(f,.13,'sine',.12,i*.08))},
 fanfare(){[392,523,659,784,1047].forEach((f,i)=>this.tone(f,.16,'triangle',.12,i*.09));this.hit(.3,3000,.05,.6,.45)},
 levelup(){[440,554,659,880].forEach((f,i)=>this.tone(f,.1,'square',.06,i*.07))},
 shoot(){this.tone(1200,.13,'sawtooth',.09,0,180)},
 boom(){this.hit(.35,220,.45,.7);this.tone(90,.3,'sine',.22,0,40)},
 over(){[440,349,262,196].forEach((f,i)=>this.tone(f,.2,'triangle',.11,i*.16))},

};
/* ================= FX (particles/confetti) ================= */
const FX={
 parts:[],raf:0,cv:null,c:null,
 init(){this.cv=document.getElementById('fx');if(!this.cv)return;this.c=this.cv.getContext('2d');
  const rs=()=>{const dp=window.devicePixelRatio||1;this.cv.width=innerWidth*dp;this.cv.height=innerHeight*dp;
   this.cv.style.width=innerWidth+'px';this.cv.style.height=innerHeight+'px';this.c.setTransform(dp,0,0,dp,0,0)};
  rs();addEventListener('resize',rs)},
 colors(){const cs=getComputedStyle(document.documentElement);
  return [cs.getPropertyValue('--a1').trim(),cs.getPropertyValue('--a2').trim(),cs.getPropertyValue('--a3').trim(),'#ffd43b','#ffffff']},
 burst(x,y,o){o=o||{};const n=o.n||14;for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=(o.spd||3)*(.5+Math.random());
  this.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,g:o.g!=null?o.g:.12,life:o.life||42,t:0,
   sz:o.sz||(2+Math.random()*3),col:o.col||pick(this.colors()),rect:false,rot:0,vr:0})}this.run()},
 confetti(n){n=n||150;for(let i=0;i<n;i++){this.parts.push({x:Math.random()*innerWidth,y:-20-Math.random()*innerHeight*.3,
  vx:(Math.random()-.5)*2,vy:2+Math.random()*3,g:.05,life:220+Math.random()*80,t:0,sz:5+Math.random()*5,
  col:pick(this.colors()),rect:true,rot:Math.random()*6,vr:(Math.random()-.5)*.3})}this.run()},
 run(){if(this.raf)return;const step=()=>{this.raf=requestAnimationFrame(step);const c=this.c;if(!c)return;
  c.clearRect(0,0,innerWidth,innerHeight);
  this.parts=this.parts.filter(p=>p.t<p.life&&p.y<innerHeight+40);
  if(!this.parts.length){cancelAnimationFrame(this.raf);this.raf=0;return}
  for(const p of this.parts){p.t++;p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.rot+=p.vr;
   c.save();c.globalAlpha=Math.max(0,1-p.t/p.life);c.translate(p.x,p.y);c.rotate(p.rot);c.fillStyle=p.col;
   if(p.rect)c.fillRect(-p.sz/2,-p.sz/2,p.sz,p.sz*.62);else{c.beginPath();c.arc(0,0,p.sz/2,0,7);c.fill()}c.restore()}
  };this.raf=requestAnimationFrame(step)},
 wordBurst(elm){try{const r=elm.getBoundingClientRect();this.burst(r.left+r.width/2,r.top+r.height/2,{n:12,spd:2.6,sz:3,life:30})}catch(e){}}

function keySpec(row){
 // returns {base,shift,id,f,w,n,sh}
 return row.map(k=>{
  if(Array.isArray(k)&&typeof k[0]==='object'&&k[0]!==null)k=k[0];
  if(typeof k==='string')return{base:k,shift:k.length===1&&/[a-z]/.test(k)?k.toUpperCase():'',id:k,f:CH2FINGER[k]||'th',w:1,n:k};
  if(Array.isArray(k))return{base:k[0],shift:k[1],id:k[0],f:CH2FINGER[k[0]]||'th',w:1,n:k[0]};
  return{base:null,shift:'',id:k.id,f:k.f||'r5',w:k.w||1,n:k.n,sh:k.sh||''};
 });
}
function keyInfoFor(ch){
 if(ch===' ')return{base:' ',id:'space',finger:'th',label:'Space',shiftKey:null};
 const lower=ch.toLowerCase();
 if(/[A-Z]/.test(ch)){const f=CH2FINGER[lower];return{base:ch,id:lower,finger:f,label:ch,shiftKey:f&&f[0]==='l'?'shift-r':'shift-l'}}
 if(SHIFTMAP[ch]){const b=SHIFTMAP[ch],f=CH2FINGER[b];return{base:ch,id:b,finger:f,label:ch,shiftKey:f&&f[0]==='l'?'shift-r':'shift-l'}}

}

   });

  });

 }
 setNext(ch){
  this.clearNext();if(!ch)return null;

 }
 press(ch,ok){

 }

}

 }

const ACH_IDS=['first_test','wpm30','wpm50','wpm80','wpm100','perfect','combo50','combo100','gamer','lessons_done'];
const ACH_ICONS={first_test:'🏁',wpm30:'🥉',wpm50:'🥈',wpm80:'🥇',wpm100:'👑',perfect:'💎',combo50:'🔥',combo100:'⚡',gamer:'🎮',lessons_done:'🎓'};

function checkAch(res){
 const s=Store.data.stats;
 if(s.tests>=1)unlockAch('first_test');
 if(res){if(res.wpm>=30)unlockAch('wpm30');if(res.wpm>=50)unlockAch('wpm50');

/* ================= TEST SAVING ================= */
function saveTest(res,label){
 const s=Store.data.stats;
 s.tests++;s.timeMs+=res.sec*1000;s.correct+=res.correct;s.incorrect+=res.bad+res.extra+res.missed;
 let pb=false;
 if(label){if(!s.bestWpm[label]||res.wpm>s.bestWpm[label]){if(s.bestWpm[label]!=null)pb=true;s.bestWpm[label]=Math.round(res.wpm)}}
 s.history.push({d:Date.now(),wpm:Math.round(res.wpm),acc:Math.round(res.acc),label:label||''});
 if(s.history.length>60)s.history.shift();
 for(const k in res.perKey){const cur=s.perKey[k]||[0,0];cur[0]+=res.perKey[k][0];cur[1]+=res.perKey[k][1];s.perKey[k]=cur}
 Store.save();checkAch(res);return pb;
}
function bestWpmOverall(){const b=Store.data.stats.bestWpm;let m=0;for(const k in b)m=Math.max(m,b[k]);return m}
function weakLetters(){
 const pk=Store.data.stats.perKey;
 return Object.entries(pk).filter(([k,v])=>/[a-z]/.test(k)&&v[0]+v[1]>=8)
  .map(([k,v])=>({k,acc:v[0]/(v[0]+v[1])})).sort((a,b)=>a.acc-b.acc).slice(0,5).map(o=>o.k);
}
function weakWords(){
 const weak=weakLetters();if(!weak.length)return null;
 const matches=COMMON.filter(w=>weak.some(l=>w.includes(l)));
 const inject=(w,l)=>{if(w.length<3)return l+w;const i=ri(0,w.length-1);return w.slice(0,i)+l+w.slice(i+1)};
 const out=[];for(let i=0;i<40;i++)out.push(matches.length&&Math.random()<.75?pick(matches):inject(pick(COMMON),pick(weak)));
 return out;
}
const RECENT_WORDS=[];const RECENT_SET=new Set();
function rememberWords(ws){for(const w of ws){if(!RECENT_SET.has(w)){RECENT_WORDS.push(w);RECENT_SET.add(w)}}
 while(RECENT_WORDS.length>500)RECENT_SET.delete(RECENT_WORDS.shift())}
function freshSrc(diff){
 const pool=diff==='easy'?EASY:COMMON;
 const fresh=pool.filter(w=>!RECENT_SET.has(w));
 return fresh.length>=30?fresh:pool;
}
function drawWords(n,diff){
 let src=shuffle(freshSrc(diff));const out=[];let guard=0;
 while(out.length<n&&guard++<300){
  for(const w of src){if(out.length>=n)break;out.push(w)}
  if(out.length<n)src=shuffle(src);
 }
 for(let i=1;i<out.length;i++){if(out[i]===out[i-1]){const alt=src.find(x=>x!==out[i-1]&&x!==out[i]);if(alt)out[i]=alt}}
 return out;
}
function genWords(n,diff){
 const out=drawWords(n,diff);
 rememberWords(out.slice(0,Math.min(n,150)));
 if(diff==='hard'){return out.map(w=>{let x=w;
  if(Math.random()<.16)x+=pick([',','.','!',';','?']);
  if(Math.random()<.07)x=pick(['(','"',"'",'-'])+x+pick([')','"','.',',']);
  return x})}
 return out;
}

 btnR.addEventListener('click',()=>{Sound.ui();restart()});
 btnN.addEventListener('click',()=>{Sound.ui();restart(true)});
 btnK.addEventListener('click',()=>{Sound.ui();kbWrap.style.display=kbWrap.style.display==='none'?'':'none'});
 toolrow.append(btnR,btnN,btnK);
 // focus handling
 tcard.addEventListener('click',()=>input.focus());
 input.addEventListener('focus',()=>tcard.classList.add('focused'));
 input.addEventListener('blur',()=>tcard.classList.remove('focused'));
 // input
 input.value='  ';
 input.addEventListener('beforeinput',e=>{
  e.preventDefault();
  if(!finished){
   if(e.inputType==='insertText'&&e.data){for(const ch of e.data)onChar(ch)}
   else if(e.inputType==='deleteContentBackward'||e.inputType==='deleteWordBackward')onBack();
  }
  if(input.value.length<2)input.value='  ';
 });
 input.addEventListener('keydown',e=>{
  if(e.key==='Backspace'){e.preventDefault();onBack();if(input.value.length<2)input.value='  '}
  else if(e.key==='Tab'||e.key==='Escape'){e.preventDefault();restart()}
 });
 const docKey=e=>{if(e.target===input)return;if(e.key==='Tab'||e.key==='Escape'){e.preventDefault();restart()}};
 document.addEventListener('keydown',docKey);
 // ---- build words
 function appendWordEls(list){list.forEach(w=>{const we=el('span','word');const arr=[];
  for(const ch of w){const cs=el('span','ch');cs.textContent=ch;we.appendChild(cs);arr.push(cs)}
  wordsEl.appendChild(we);wordEls.push(we);charEls.push(arr);typed.push('')})}
 function buildWords(){
  wordsEl.innerHTML='';wordEls=[];charEls=[];typed=W.map(()=>'');
  W.forEach(w=>{const we=el('span','word');const arr=[];
   for(const ch of w){const cs=el('span','ch');cs.textContent=ch;we.appendChild(cs);arr.push(cs)}
   wordsEl.appendChild(we);wordEls.push(we);charEls.push(arr)});
  wordsEl.appendChild(caret);
  lh=parseFloat(getComputedStyle(wordsEl).lineHeight)||45;
  caret.style.height=Store.data.settings.caret==='underline'?'3.5px':(lh*.72)+'px';
 }
 function updateWord(i){
  const cur=W[i],tp=typed[i],arr=charEls[i];if(!arr)return;
  while(arr.length<Math.max(cur.length,tp.length)){const s=el('span','ch');wordEls[i].appendChild(s);arr.push(s)}
  while(arr.length>Math.max(cur.length,tp.length)){arr.pop().remove()}
  for(let j=0;j<arr.length;j++){
   let cls='ch';
   if(j<tp.length)cls+=j<cur.length?(tp[j]===cur[j]?' ok':' bad'):' extra';
   arr[j].className=cls;
  }
  wordEls[i].classList.toggle('cur',i===wi&&!finished);
 }
 function rowPitch(){
  for(let i=1;i<wordEls.length;i++){const ot=wordEls[i].offsetTop;if(ot>0)return ot}
  return lh;
 }
 function setCaret(){
  const arr=charEls[wi]||[];if(!arr.length){caret.style.transform='translate(0,0)';return}
  let x,y;
  if(typed[wi].length<arr.length){const s=arr[typed[wi].length];x=s.offsetLeft;y=s.offsetTop}
  else{const s=arr[arr.length-1];x=s.offsetLeft+s.offsetWidth;y=s.offsetTop}
  caret.style.transform=`translate(${x}px,${y}px)`;
  caret.classList.add('typing');clearTimeout(idleT);idleT=setTimeout(()=>caret.classList.remove('typing'),900);
  const pitch=rowPitch(),top=wordEls[wi].offsetTop;
  const shift=Math.min(0,-(top-pitch));
  wordsEl.style.transform=`translateY(${shift}px)`;
 }
 function updateNext(){
  if(!kb){hintChip.innerHTML='';return}
  const cur=W[wi]||'',tp=typed[wi]||'';
  const ch=tp.length<cur.length?cur[tp.length]:' ';
  const info=kb.setNext(ch);
  if(info){
   hintChip.innerHTML=`<span class="fdot" style="--fc:${FINGER_COLOR[info.finger]}"></span>
    <span style="color:var(--text);font-weight:800">${esc(t('f.'+info.finger))}</span><span>→</span>
    <span class="keycap">${esc(info.id==='space'?'Space':info.label.toUpperCase())}</span>
    ${info.shiftKey?'<span class="keycap">Shift</span>':''}`;
  }else hintChip.innerHTML='';
 }
 function popCombo(txt){comboPop.textContent=txt;comboPop.classList.remove('on');void comboPop.offsetWidth;comboPop.classList.add('on')}
 function setStat(box,val){if(!box)return;const sv=box.querySelector('.sv');if(sv.textContent!==String(val)){sv.textContent=val;sv.classList.remove('pulse');void sv.offsetWidth;sv.classList.add('pulse')}}
 function updateLive(){
  if(!statsbar)return;
  if(started&&!finished){
   const m=(performance.now()-t0)/60000;
   setStat(wpmBox,Math.round(correct/5/Math.max(m,.0001)));
   const tot=correct+bad+extra;setStat(accBox,Math.round(100*correct/Math.max(tot,1))+'%');
  }
  setStat(comboBox,combo>0?combo+'🔥':'0');
 }
 function updateProgress(){
  if(!progrow)return;
  progrow.querySelector('#pln').textContent=Math.min(wi+(typed[wi]&&typed[wi].length?1:0),W.length)+'/'+W.length;
  progrow.querySelector('.fill').style.width=(100*Math.min(wi+(typed[wi]&&typed[wi].length?1:0),W.length)/W.length)+'%';
 }
 function submitWord(){
  const cur=W[wi],tp=typed[wi];
  if(tp.length<cur.length){missed+=cur.length-tp.length;
   for(let j=tp.length;j<cur.length;j++){perKey[cur[j]]=perKey[cur[j]]||[0,0];perKey[cur[j]][1]++}}
  wordEls[wi].classList.add('done');wordEls[wi].classList.remove('cur');
  FX.wordBurst(wordEls[wi]);
  if(opts.mode!=='time'&&wi===W.length-1){finish();return}
  if(wi<W.length-1){
   wi++;updateWord(wi);setCaret();updateNext();updateStatsWords();updateProgress();
   if(opts.mode==='time'&&wi>W.length-40){const more=opts.genMore?opts.genMore():genWords(80,'med');W=W.concat(more);appendWordEls(more)}
  }
 }
 function onChar(ch){
  if(finished)return;
  if(!started){started=true;tcard.classList.add('started');t0=performance.now();startTick()}
  if(ch===' '){Sound.key(true);if(typed[wi].length===0)return;submitWord();return}
  const cur=W[wi],tp=typed[wi],exp=cur[tp.length];let ok=true;
  typedTotal++;
  if(exp==null){extra++;ok=false}
  else{perKey[exp]=perKey[exp]||[0,0];if(exp===ch){correct++;perKey[exp][0]++}else{bad++;perKey[exp][1]++;ok=false}}
  typed[wi]+=ch;
  if(ok){combo++;if(combo>maxCombo)maxCombo=combo;
   if(combo>=10&&combo%25===0){Sound.combo();popCombo('🔥 '+t('practice.combo')+' x'+combo+'!')}}
  else{combo=0;Sound.err();missflash.classList.remove('on');void missflash.offsetWidth;missflash.classList.add('on');shakeEl(tcard)}
  Sound.key(false);
  if(kb)kb.press(ch,ok);
  updateWord(wi);setCaret();updateNext();updateLive();
  if(opts.mode!=='time'&&wi===W.length-1&&typed[wi].length>=W[wi].length)finish();
 }
 function onBack(){
  if(finished)return;
  const tp=typed[wi];
  if(tp.length>0){typed[wi]=tp.slice(0,-1);updateWord(wi)}
  else if(wi>0&&typed[wi-1]!==W[wi-1]){wi--;wordEls[wi].classList.remove('done');updateWord(wi)}
  setCaret();updateNext();Sound.key(true);
 }
 function updateStatsWords(){if(timeBox&&timeBox.dataset.words)setStat(timeBox,Math.min(wi+(typed[wi]&&typed[wi].length?1:0),W.length))}
 function startTick(){
  clearInterval(timer);
  timer=setInterval(()=>{
   const el2=(performance.now()-t0)/1000,secInt=Math.floor(el2);
   if(secInt>lastSec){lastSec=secInt;sample();drawSpark();updateLive()}
   if(opts.mode==='time'){
    if(timeBox)setStat(timeBox,Math.max(0,Math.ceil(opts.timeLimit-el2))+'s');
    if(el2>=opts.timeLimit){finish();return}
   }else if(timeBox&&!timeBox.dataset.words){setStat(timeBox,fmt1(el2)+'s')}
  },100);
 }
 function sample(){
  const m=(performance.now()-t0)/60000;if(m<=0)return;
  samples.push({t:lastSec,wpm:correct/5/m,raw:typedTotal/5/m});
  if(samples.length>500)samples.shift();
 }
 function drawSpark(){
  if(!sparkCv)return;const c=sparkCv.getContext('2d'),dp=window.devicePixelRatio||1;
  const w=sparkCv.clientWidth||300,h=sparkCv.clientHeight||44;
  sparkCv.width=w*dp;sparkCv.height=h*dp;c.setTransform(dp,0,0,dp,0,0);c.clearRect(0,0,w,h);
  const cs=getComputedStyle(document.documentElement);
  if(samples.length<2)return;
  const a2=cs.getPropertyValue('--a2').trim(),mx=Math.max(...samples.map(s=>s.wpm),10);
  c.beginPath();
  samples.forEach((s,i)=>{const x=8+(w-16)*i/(samples.length-1),y=h-7-(h-14)*(s.wpm/mx);i?c.lineTo(x,y):c.moveTo(x,y)});
  c.strokeStyle=a2;c.lineWidth=2;c.lineJoin='round';c.stroke();
  c.lineTo(w-8,h-2);c.lineTo(8,h-2);c.closePath();
  const gr=c.createLinearGradient(0,0,0,h);gr.addColorStop(0,a2+'55');gr.addColorStop(1,a2+'00');c.fillStyle=gr;c.fill();
 }
 function finish(){
  if(finished)return;finished=true;clearInterval(timer);
  const sec=started?(performance.now()-t0)/1000:0,m=Math.max(sec,.5)/60;
  const wpm=correct/5/m,raw=typedTotal/5/m,tot=correct+bad+extra+missed;
  const acc=tot?correct/tot*100:100;
  let cons=100;
  if(samples.length>1){const arr=samples.map(s=>s.raw),mean=arr.reduce((a,b)=>a+b,0)/arr.length;
   if(mean>0){const sd=Math.sqrt(arr.reduce((a,b)=>a+(b-mean)*(b-mean),0)/arr.length);cons=clamp(Math.round(100*(1-sd/mean)),0,100)}}
  if(kb)kb.clearNext();hintChip.innerHTML='';comboPop.classList.remove('on');
  tcard.classList.add('done');
  const res={wpm,raw,acc,cons,correct,bad,extra,missed,sec,samples,perKey,maxCombo,
   wordsTyped:opts.mode==='time'?wi+1:W.length,label:opts.label||'',
   meta:typeof opts.meta==='function'?opts.meta():(opts.meta||null)};
  let cb=null;try{cb=opts.onFinish?opts.onFinish(res):null}catch(e){console.warn(e)}
  renderResults(res,cb);
  tcard.style.display='none';if(statsbar)statsbar.style.opacity='.35';
  if(sparkWrap)sparkWrap.style.display='none';kbWrap.style.display='none';
  toolrow.style.display='none';if(progrow)progrow.style.display='none';
  results.classList.add('show');
 }
 function renderResults(res,cb){
  const pb=cb&&cb.pb,stars=cb&&cb.stars!=null?cb.stars:null,pass=cb?!!cb.pass:true,actions=(cb&&cb.actions)||[];
  const weak=Object.entries(res.perKey).filter(x=>x[1][0]+x[1][1]>=5)
   .map(x=>({k:x[0],acc:x[1][0]/(x[1][0]+x[1][1])})).sort((a,b)=>a.acc-b.acc).slice(0,3);
  const box=(lab,val,cls)=>`<div class="rbox"><div class="rv ${cls||''}">${val}</div><div class="rl">${esc(lab)}</div></div>`;
  results.innerHTML=`
   ${pb?`<div style="text-align:center;margin-bottom:12px"><span class="pb-badge">${esc(t('r.pb'))}</span></div>`:''}
   ${stars!=null?`<div class="res-msg ${pass?'ok':'no'}">${esc(pass?t('l.pass'):t('l.fail'))}</div>
    <div class="bigstars">${[1,2,3].map(i=>`<span class="bstar${i<=stars?' on':''}">★</span>`).join('')}</div>`:''}
   <div class="res-hero">
    <div class="res-big wpm"><div class="rv">${Math.round(res.wpm)}</div><div class="rl">${esc(t('r.wpm'))}</div></div>
    <div class="res-big"><div class="rv" style="color:var(--good)">${Math.round(res.acc)}%</div><div class="rl">${esc(t('r.acc'))}</div></div>
   </div>
   <div class="res-grid">
    ${box(t('r.raw'),Math.round(res.raw))}${box(t('r.cons'),res.cons+'%')}
    ${box(t('r.time'),fmt1(res.sec)+t('misc.sec'))}${box(t('r.words'),res.wordsTyped)}
    ${box(t('r.combo'),res.maxCombo+'🔥')}${box(t('r.correct'),res.correct,'good')}
    ${box(t('r.bad'),res.bad,'badc')}${box(t('r.extra')+' + '+t('r.missed'),(res.extra+res.missed),'badc')}
   </div>
   ${samplesChart(res.samples)?`<div class="res-chart"><div class="cl">${esc(t('r.chart'))}</div>${samplesChart(res.samples)}</div>`:''}
   ${weak.length?`<div class="res-keys"><span class="muted" style="font-size:13px;font-weight:700">${esc(t('r.weak'))}:</span>${weak.map(w=>`<span class="keycap bad">${esc(w.k.toUpperCase())}·${Math.round(w.acc*100)}%</span>`).join('')}</div>`:''}
   ${res.meta&&res.meta.author?`<p class="muted" style="text-align:center;font-size:13px;margin-top:8px">${esc(res.meta.author)}</p>`:''}
   <div class="res-actions">
    <button class="btn primary" data-act="again">${esc(t('r.again'))}</button>
    <button class="btn ghost" data-act="new">${esc(t('r.new'))}</button>
    ${actions.map((a,i)=>`<button class="btn ${a.primary?'primary':'ghost'}" data-x="${i}">${a.label}</button>`).join('')}
   </div>`;
  results.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
   Sound.ensure();Sound.ui();
   if(b.dataset.act==='again')restart(false);
   else if(b.dataset.act==='new')restart(true);
   else{const i=+b.dataset.x;actions[i]&&actions[i].onClick&&actions[i].onClick()}
  }));
  if(pb){FX.confetti();Sound.fanfare()}
  else if(stars!=null){if(pass){if(stars>=3){Sound.fanfare();FX.confetti(130)}else Sound.success()}else Sound.err()}
  else Sound.success();
 }
 function restart(newSet){
  if(opts.genWords&&newSet!==false)W=opts.genWords();
  wi=0;started=false;finished=false;t0=0;lastSec=0;
  tcard.classList.remove('started');
  correct=bad=extra=missed=typedTotal=combo=maxCombo=0;perKey={};samples=[];
  clearInterval(timer);timer=null;
  buildWords();updateWord(0);setCaret();updateNext();updateLive();updateProgress();drawSpark();
  if(statsbar){statsbar.style.opacity='';if(timeBox)setStat(timeBox,opts.mode==='time'?opts.timeLimit+'s':'0')}
  tcard.style.display='';tcard.classList.remove('done');
  if(sparkWrap)sparkWrap.style.display='';
  kbWrap.style.display=kb?'':'none';toolrow.style.display='';
  if(progrow){progrow.style.display=''}
  results.classList.remove('show');results.innerHTML='';
  setTimeout(()=>input.focus(),30);
 }
 // init
 buildWords();updateWord(0);setCaret();updateNext();updateProgress();
 setTimeout(()=>{try{input.focus()}catch(e){}},80);
 return{
  el:comp,
  setMeta(a){opts.meta={author:a}},
  restart,
  destroy(){clearInterval(timer);clearTimeout(idleT);document.removeEventListener('keydown',docKey);input.remove();if(kb)kb.destroy()}
 };
}
</script>

<script>
'use strict';
/* ================= PRACTICE VIEW ================= */
Views.practice=(params)=>{
 const state={mode:'story',subTime:30,subWords:25,diff:'med',weak:!!(params&&params.weak)};
 if(state.weak&&!weakWords())state.weak=false;
 const v=el('div');
 v.innerHTML=`<div class="wrap section" style="padding-top:26px">
  <div class="sec-head" style="text-align:center;margin-bottom:14px"><h1 class="sec-title">⌨️ <b>${esc(t('nav.practice'))}</b></h1></div>
  <div class="modebar" id="modebar"></div>
  <div id="thost"></div>
 </div>`;
 const modebar=v.querySelector('#modebar'),host=v.querySelector('#thost');
 let tt=null,quoteAuthor=null,storyTitle=null;
 const sub=()=>state.mode==='time'?state.subTime:state.subWords;
 const label=()=>state.weak?'weak':state.mode==='time'?'time'+state.subTime:state.mode==='words'?'words'+state.subWords:state.mode==='quote'?'quote':'story';
 function makeWords(){
  if(state.weak){const w=weakWords();if(w){quoteAuthor=null;storyTitle=null;return w}}
  if(state.mode==='story'){const st=pickStory();quoteAuthor=null;storyTitle=st.t;return st.s.toLowerCase().split(/\s+/)}
  if(state.mode==='quote'){const q=pick(QUOTES);quoteAuthor=q.a;storyTitle=null;return q.q.toLowerCase().split(' ')}
  quoteAuthor=null;storyTitle=null;
  return genWords(state.mode==='time'?220:sub(),state.diff);
 }
 function createTT(){
  tt=TypingTest({
   words:makeWords(),mode:(state.weak||state.mode==='story')?'words':state.mode,timeLimit:state.subTime,
   liveStats:true,showProgress:state.mode==='story',label:label(),
   genWords:makeWords,genMore:()=>genWords(80,state.diff),
   meta:()=>({author:quoteAuthor?'— '+quoteAuthor:(storyTitle?'📖 '+storyTitle:null)}),
   onFinish:res=>({pb:saveTest(res,label())})
  });
  host.appendChild(tt.el);
 }
 function chip(lbl,active,fn){const c=el('button','chip'+(active?' active':''),lbl);c.addEventListener('click',()=>{Sound.ensure();Sound.ui();fn()});return c}
 function buildChips(){
  modebar.innerHTML='';
  if(state.weak){
   modebar.appendChild(chip('🎯 '+t('practice.weak'),true,()=>{state.weak=false;refresh()}));
   return;
  }
  [['story','practice.m.story'],['time','practice.m.time'],['words','practice.m.words'],['quote','practice.m.quote']].forEach(([m,k])=>{
   modebar.appendChild(chip(t(k),state.mode===m,()=>{state.mode=m;refresh()}));
  });
  if(state.mode!=='quote'&&state.mode!=='story'){
   modebar.appendChild(el('span','sep'));
   if(state.mode==='time')[15,30,60,120].forEach(n=>modebar.appendChild(chip(n+'s',state.subTime===n,()=>{state.subTime=n;refresh()})));
   else [10,25,50,100].forEach(n=>modebar.appendChild(chip(n,state.subWords===n,()=>{state.subWords=n;refresh()})));
   modebar.appendChild(el('span','sep'));
   modebar.appendChild(el('span','chip-label',esc(t('practice.diff'))));
   [['easy','practice.d.easy'],['med','practice.d.med'],['hard','practice.d.hard']].forEach(([d,k])=>modebar.appendChild(chip(t(k),state.diff===d,()=>{state.diff=d;refresh()})));
  }
  if(weakLetters().length)modebar.appendChild(chip('🎯 '+t('practice.weak'),false,()=>{state.weak=true;refresh()}));
 }
 function refresh(){
  if(tt){tt.destroy();host.innerHTML='';tt=null}
  createTT();buildChips();
 }
 createTT();buildChips();
 return{el:v,destroy(){if(tt)tt.destroy()}};
};
/* ================= LESSONS LIST ================= */
function lessonKeyDisp(L){
 if(L.nk)return L.nk.map(k=>k==='Shift'?'⇧':k===' '?'␣':k.toUpperCase());
 return({6:['A','S','D','F','J','K','L',';'],15:['A','B','C','…','Z'],16:['⇧','Aa'],17:['1','2','…','0'],18:['!','?',',','.']}[L.id])||['★'];
}
Views.lessons=()=>{
 const s=Store.data.stats.lessons;
 const totalStars=LESSONS.reduce((a,L)=>a+((s[L.id]||{}).stars||0),0);
 const v=el('div');
 v.innerHTML=`<div class="wrap section" style="padding-top:26px">
  <div class="sec-head" style="text-align:center"><h1 class="sec-title">📚 <b>${esc(t('l.title'))}</b></h1>
  <p class="sec-sub">${esc(t('l.sub'))} · ⭐ ${totalStars}/${LESSONS.length*3}</p></div>
  <div class="lesson-grid" id="lgrid"></div>
 </div>`;
 const grid=v.querySelector('#lgrid');
 LESSONS.forEach((L,i)=>{
  const st=(s[L.id]||{}).stars||0;
  const unlocked=i===0||((s[LESSONS[i-1].id]||{}).stars||0)>0;
  const c=el('div','card hov lcard'+(unlocked?'':' locked'));
  c.innerHTML=`<div class="ltop"><span class="lnum">${String(L.id).padStart(2,'0')}</span>
   <span class="lstars">${[1,2,3].map(x=>`<span class="${x<=st?'on':''}">★</span>`).join('')}</span></div>
   ${unlocked?'':'<span class="lockic">🔒</span>'}
   <h3>${esc(L.ten)}</h3>
   <div class="lkeys">${lessonKeyDisp(L).map(k=>`<span>${esc(k)}</span>`).join('')}</div>`;
  c.addEventListener('click',()=>{
   Sound.ensure();Sound.ui();
   if(unlocked)Router.go('lesson',{id:L.id});
   else toast('🔒',t('l.locked'),t('l.lockmsg'));
  });
  grid.appendChild(c);
 });
 return{el:v};
};
/* ================= LESSON DETAIL ================= */
Views.lesson=(p)=>{
 const L=LESSONS.find(x=>x.id===(p&&p.id))||LESSONS[0];
 const prevBest=(Store.data.stats.lessons[L.id]||{}).stars||0;
 const v=el('div');
 v.innerHTML=`<div class="wrap section" style="padding-top:26px">
  <div class="lesson-head">
   <button class="btn ghost sm" id="lback">← ${esc(t('l.all'))}</button>
   <h2>${String(L.id).padStart(2,'0')} · ${esc(L.ten)}</h2>
   <span class="grow"></span>
   <span class="lstars" style="font-size:20px">${[1,2,3].map(x=>`<span class="${x<=prevBest?'on':''}">★</span>`).join('')}</span>
  </div>
  <div class="card" id="intro" style="margin-bottom:18px">
   <div class="sec-title" style="font-size:16px;text-align:center;margin-bottom:14px">🔑 ${esc(t('l.newkeys'))}</div>
   <div class="keycaps" id="kcaps"></div>
   <div class="hands-wrap" id="lhands"></div>
   <div class="inst-list">
    <div class="inst"><span class="iic">📝</span><div><div class="ibn">${esc(L.ien)}</div></div></div>
   </div>
   <div style="text-align:center;margin-top:20px"><button class="btn primary" id="lstart" style="font-size:17px;padding:14px 34px">${esc(t('l.start'))}</button></div>
  </div>
  <div id="drill"></div>
 </div>`;
 const kc=v.querySelector('#kcaps'),lh=v.querySelector('#lhands');
 const dispKeys=L.nk&&L.nk.length?L.nk:lessonKeyDisp(L).map(x=>x==='⇧'?'Shift':x);
 let fingers=[];
 dispKeys.forEach(k=>{
  if(k==='Shift'){
   kc.appendChild(el('span','keycap big','⇧ Shift'));
   fingers.push('l5','r5');
  }else{
   const f=CH2FINGER[k.toLowerCase()]||'th';
   const kp=el('span','keycap big f',esc(k.toUpperCase()));
   kp.style.setProperty('--fc',FINGER_COLOR[f]);

function drawGrid(c,W,H,off){
 c.strokeStyle='rgba(255,255,255,.04)';c.lineWidth=1;const g=40,o=((off%g)+g)%g;
 c.beginPath();
 for(let x=.5-o;x<W;x+=g){c.moveTo(x,0);c.lineTo(x,H)}
 for(let y=.5-o;y<H;y+=g){c.moveTo(0,y);c.lineTo(W,y)}
 c.stroke();
}
function drawReticle(c,x,y,w,h,col,t){
 const p=1+Math.sin(t*9)*.06,L=Math.max(7,Math.min(11,Math.min(w,h)*.32)),o=3*p;
 c.strokeStyle=col;c.lineWidth=2;c.lineCap='round';c.shadowColor=col;c.shadowBlur=9;
 const K=[[x-o,y-o,1,1],[x+w+o,y-o,-1,1],[x-o,y+h+o,1,-1],[x+w+o,y+h+o,-1,-1]];
 for(const q of K){c.beginPath();c.moveTo(q[0]+q[2]*L,q[1]);c.lineTo(q[0],q[1]);c.lineTo(q[0],q[1]+q[3]*L);c.stroke()}
 c.shadowBlur=0;
}
function drawShip(c,x,y,s,col,t){
 c.save();c.translate(x,y);
 const fl=15+Math.sin(t*22)*4;
 c.fillStyle='rgba(255,255,255,.14)';
 c.beginPath();c.moveTo(0,-17*s);c.lineTo(4.5*s,-3*s);c.lineTo(15*s,9*s);c.lineTo(6*s,6*s);c.lineTo(0,10*s);c.lineTo(-6*s,6*s);c.lineTo(-15*s,9*s);c.lineTo(-4.5*s,-3*s);c.closePath();c.fill();
 c.strokeStyle=col;c.lineWidth=1.6;c.shadowColor=col;c.shadowBlur=10;c.stroke();
 c.shadowBlur=0;c.fillStyle='rgba(255,255,255,.9)';c.beginPath();c.arc(0,-6.5*s,2.2*s,0,7);c.fill();
 c.globalAlpha=.8;c.fillStyle=col;
 c.beginPath();c.moveTo(-3.4*s,9*s);c.lineTo(0,fl*s);c.lineTo(3.4*s,9*s);c.closePath();c.fill();
 c.globalAlpha=1;c.restore();
}
function drawEnemyShip(c,x,y,s,col){
 c.save();c.translate(x,y);c.scale(1,-1);
 c.fillStyle='rgba(255,255,255,.12)';c.strokeStyle=col;c.lineWidth=1.2;
 c.beginPath();c.moveTo(0,8*s);c.lineTo(7.5*s,-3*s);c.lineTo(3*s,-1*s);c.lineTo(0,-6*s);c.lineTo(-3*s,-1*s);c.lineTo(-7.5*s,-3*s);c.closePath();c.fill();c.stroke();
 c.restore();
}
function drawTracers(c,list,col){
 for(const b of list){const p=Math.min(1,b.t/.09),
  hx=b.x1+(b.x2-b.x1)*p,hy=b.y1+(b.y2-b.y1)*p,
  tx=b.x1+(b.x2-b.x1)*Math.max(0,p-.35),ty=b.y1+(b.y2-b.y1)*Math.max(0,p-.35);
  c.globalAlpha=.9;c.strokeStyle=col;c.lineWidth=2.2;c.shadowColor=col;c.shadowBlur=8;
  c.beginPath();c.moveTo(tx,ty);c.lineTo(hx,hy);c.stroke();c.shadowBlur=0;c.globalAlpha=1}
}
function drawRings(c,list,col){
 for(const r of list){const p=r.t/.4;
  c.globalAlpha=Math.max(0,1-p);c.strokeStyle=col;c.lineWidth=2.5*(1-p)+.5;
  c.beginPath();c.arc(r.x,r.y,4+p*r.max,0,7);c.stroke();c.globalAlpha=1}
}

function gameInput(shell,handlers){

 inp.setAttribute('autocapitalize','off');inp.setAttribute('autocorrect','off');inp.value='  ';

  e.preventDefault();
  if(e.inputType==='insertText'&&e.data)handlers.char(e.data);
  else if(e.inputType.indexOf('delete')===0)handlers.back();
  keep();
 });
 inp.addEventListener('keydown',e=>{
  if(e.key==='Backspace'){e.preventDefault();handlers.back();keep()}
  else if(e.key==='Escape'){e.preventDefault();handlers.esc&&handlers.esc()}
  else if(e.key==='Tab')e.preventDefault();
 });
 const pd=()=>{if(inp!==document.activeElement)inp.focus()};

}

 const cv=shell.querySelector('canvas'),c=cv.getContext('2d');
 let W=300,H=440;
 function resize(){const dp=window.devicePixelRatio||1;const r=cv.getBoundingClientRect();W=Math.max(200,r.width);H=Math.max(200,r.height);cv.width=W*dp;cv.height=H*dp;c.setTransform(dp,0,0,dp,0,0)}
 let words=[],parts=[],stars=[],bullets=[],rings=[],lock=null,running=false,paused=false,over=false,raf=0,last=0;
 let spawnT=1,score=0,lives=3,level=1,combo=0,typedCount=0,buffer='',flashT=0,bannerT=null,bt=0,activeT=0,keysT=0,hitsT=0,statT=0;
 const q=id=>shell.querySelector(id);

 function pool(){if(level<3)return EASY.filter(w=>w.length>=3);if(level<7)return COMMON.filter(w=>w.length>=4&&w.length<=6);return COMMON.filter(w=>w.length>=5&&w.length<=8)}

 function complete(w){words=words.filter(x=>x!==w);typedCount++;combo++;score+=w.text.length*10+combo*2;

 function gameOver(){over=true;running=false;cancelAnimationFrame(raf);Sound.over();

 function start(){words=[];parts=[];bullets=[];rings=[];lock=null;buffer='';score=0;lives=3;level=1;combo=0;typedCount=0;spawnT=1;flashT=0;activeT=0;keysT=0;hitsT=0;statT=0;q('#hW').textContent='0';q('#hA').textContent='100%';

function histChart(hist){
 if(!hist||hist.length<2)return`<p class="muted" style="text-align:center;padding:26px 0">${esc(t('st.empty'))}</p>`;
 const data=hist.slice(-40),w=640,h=180,p=30;
 const ys=data.map(d=>d.wpm),mx=Math.max(...ys,10),mn=Math.min(...ys,0);
 const X=i=>p+(w-2*p)*i/(data.length-1),Y=val=>h-p-(h-2*p)*((val-mn)/Math.max(1,mx-mn));
 const pts=data.map((d,i)=>[X(i),Y(d.wpm)]);
 const path=pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
 const area=path+` L${X(data.length-1).toFixed(1)} ${h-p} L${X(0).toFixed(1)} ${h-p} Z`;
 return`<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block">
  <defs><linearGradient id="stg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--a2)" stop-opacity=".3"/><stop offset="1" stop-color="var(--a2)" stop-opacity="0"/></linearGradient></defs>
  <path d="${area}" fill="url(#stg)"/><path d="${path}" fill="none" stroke="var(--a2)" stroke-width="2.5" stroke-linejoin="round"/>
  ${pts.map((qq,i)=>`<circle cx="${qq[0].toFixed(1)}" cy="${qq[1].toFixed(1)}" r="3" fill="var(--a1)"><title>${data[i].wpm} WPM · ${data[i].acc}%</title></circle>`).join('')}
  <text x="4" y="${(Y(mx)+4).toFixed(1)}" font-size="10" fill="var(--muted)">${Math.round(mx)}</text>
  <text x="4" y="${(h-p+4).toFixed(1)}" font-size="10" fill="var(--muted)">${Math.round(mn)}</text>
 </svg>`;
}

 }).join('');
}

 v.querySelector('#rgVol').addEventListener('input',function(){st.sound.vol=this.value/100;Store.save();Sound.apply()});
 v.querySelector('#rgVol').addEventListener('change',function(){Sound.ensure();Sound.key(false)});
 segBind('#sgStyle',val=>{st.sound.style=val;Store.save();Sound.ensure();Sound.key(false);Router.rerender()});
 segBind('#sgCaret',val=>{st.caret=val;Store.save();Router.rerender()});
 v.querySelector('#swKb').addEventListener('click',function(){this.classList.toggle('on');st.showKb=this.classList.contains('on');Store.save();Sound.ui()});
 let armed=false;const btnR=v.querySelector('#btnReset');
 btnR.addEventListener('click',()=>{
  Sound.ui();
  if(!armed){armed=true;btnR.textContent='⚠ '+t('se.reset2');setTimeout(()=>{armed=false;btnR.textContent=t('se.reset')},3000)}
  else{Store.reset();Store.data.stats.welcomed=true;Store.save();document.documentElement.dataset.theme='synthwave';applyStaticI18n();updateSoundBtn();
   toast('✅',t('se.resetdone'));Router.go('home')}
 });
 return{el:v};
};
/* ================= APP CHROME ================= */
function applyStaticI18n(){$$('[data-i18n]').forEach(e=>{e.textContent=t(e.dataset.i18n)})}
function applyTheme(id){Store.data.settings.theme=id;Store.save();document.documentElement.dataset.theme=id;
 $$('#themePop .tsw').forEach(b=>b.classList.toggle('active',b.dataset.theme===id))}
function updateSoundBtn(){const b=$('#soundBtn');if(!b)return;b.textContent=Store.data.settings.sound.on?'🔊':'🔇'}
function buildThemePop(){
 const pop=$('#themePop');pop.innerHTML='';
 THEMES.forEach(th=>{
  const b=el('button','tsw'+(Store.data.settings.theme===th.id?' active':''),`<span class="sw"></span>${th.n}`);
  b.dataset.theme=th.id;
  b.addEventListener('click',()=>{Sound.ensure();Sound.ui();applyTheme(th.id)});
  pop.appendChild(b);
 });
}
function initChrome(){
 // nav
 $$('.navlink, .logo').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();Sound.ui();Router.go(a.dataset.route||'home')}));
 $('#burger').addEventListener('click',()=>{Sound.ui();document.body.classList.toggle('nav-open')});
 // sound btn
 $('#soundBtn').addEventListener('click',()=>{const st=Store.data.settings.sound;st.on=!st.on;Store.save();Sound.apply();updateSoundBtn();Sound.ensure();if(st.on)Sound.ui()});
 // theme pop
 $('#themeBtn').addEventListener('click',e=>{e.stopPropagation();Sound.ensure();Sound.ui();$('#themePop').classList.toggle('show')});
 document.addEventListener('click',e=>{const tw=e.target.closest('.themewrap');if(!tw)$('#themePop')&&$('#themePop').classList.remove('show')});
 // audio unlock
 ['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,()=>Sound.ensure(),{once:true,capture:true}));
}
/* ================= INIT ================= */
(function init(){
 Store.load();
 if(!Store.data.settings)Store.data=defaultData();
 document.documentElement.dataset.theme=Store.data.settings.theme||'synthwave';
 LANG='en';Store.data.settings.lang='en';
 FX.init();
 applyStaticI18n();
 buildThemePop();
 updateSoundBtn();
 initChrome();
 Router.go('home');
 if(!Store.data.stats.welcomed){
  Store.data.stats.welcomed=true;Store.save();
  if(Store.ok)setTimeout(()=>toast('👋',t('w.t'),t('w.d'),6500),800);
 }
})();
</script>
</body>
</html>
